<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rocket League Match Stats</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <h1>Rocket League · Match Stats</h1>

  <section id="pro">
    <div class="chips" id="modes"><button data-mode="3" class="on">3v3</button><button data-mode="2">2v2</button><button data-mode="1">1v1</button></div>
    <div class="rank">
      <div class="rhead"><b>Top teams · game win rate</b>
        <div class="chips" id="period"><button data-days="30" class="on">1 month</button><button data-days="180">6 months</button><button data-days="365">1 year</button></div>
      </div>
      <div id="rankbody"></div>
      <div id="teamgames"></div>
    </div>
    <div class="rank">
      <div class="rhead"><b>Top players · rating</b><span class="hint">1.00 = average · &gt;1.5 amazing · &lt;0.5 awful</span></div>
      <div id="playerbody"></div>
    </div>
    <div id="tourneys"></div>
  </section>

  <div id="msg"></div>
  <div id="out"></div>
  <p class="foot">Pro data: ballchasing.com.</p>
</div>
<script src="prating.js"></script>
<script src="app.js"></script>
</body>
</html>
