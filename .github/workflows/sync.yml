name: Sync match history

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node sync.js
        env:
          BALLCHASING_TOKEN: ${{ secrets.BALLCHASING_TOKEN }}
      - name: Commit changes
        run: |
          git config user.name "match-sync"
          git config user.email "match-sync@users.noreply.github.com"
          git add data/games.json
          git diff --cached --quiet || (git commit -m "Update match history" && git push)
